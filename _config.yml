title: itingyu · 博客
# 静态资源版本号:改动 assets/ 后 bump 一次,浏览器立刻拿到新文件
asset_version: 20261101f
description: itingyu 的个人博客。记录命名系统与厨房实践。
lang: zh-CN
url: https://itingyu.github.io
baseurl: ""
timezone: Asia/Shanghai

permalink: /notes/:column/:series/:slug/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true

plugins:
  - jekyll-seo-tag
  - jekyll-optional-front-matter

safe: true

collections:
  series:
    output: true
    permalink: /series/:name/
  columns:
    output: true
    permalink: /column/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: series
    values:
      layout: series-detail
  - scope:
      path: ""
      type: columns
    values:
      layout: column
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - inbox/
  - node_modules/
  - package.json
  - package-lock.json
  - scripts/
  - README.md
  - CHANGELOG.md
  - docs/
  - .githooks/
  - Gemfile
  - Gemfile.lock
  - vendor/
