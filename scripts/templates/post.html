<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{TITLE}} · itingyu</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <meta name="author" content="{{AUTHOR}}" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="canonical" href="https://itingyu.github.io/posts/{{SLUG}}/" />

  <!-- Open Graph -->
  <meta property="og:type" content="article" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:url" content="https://itingyu.github.io/posts/{{SLUG}}/" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="article:published_time" content="{{DATE}}" />
  <meta property="article:author" content="{{AUTHOR}}" />
{{TAGS_HTML}}
  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "{{TITLE}}",
    "datePublished": "{{DATE}}",
    "dateModified": "{{DATE}}",
    "author": { "@type": "Person", "name": "{{AUTHOR}}" },
    "url": "https://itingyu.github.io/posts/{{SLUG}}/",
    "description": "{{DESCRIPTION}}"
  }
  </script>

  <script>
    (function(){
      try {
        var t = localStorage.getItem('itingyu-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="/assets/style.css" />
  <script defer src="/assets/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>

  <header class="site-header">
    <a class="site-brand" href="/">
      <span class="site-brand-mark">i</span>
      <span>itingyu</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a href="/">首页</a>
      <a href="/posts/">文章</a>
      <a href="/archive/">归档</a>
      <a href="/tags/">标签</a>
      <a href="/about/">关于</a>
      <button class="theme-toggle" type="button"
              aria-label="切换主题" data-theme-toggle>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
    </nav>
  </header>

  <main id="main" class="container">
    <article>
      <header class="article-header">
        <h1>{{TITLE}}</h1>
        <div class="post-meta">
          <time datetime="{{DATE}}">{{DATE}}</time>
          <span class="dot">·</span>
{{POSTMETA_TAGS}}
          <span class="dot">·</span>
          <span>约 3 分钟</span>
        </div>
        <p class="post-excerpt">{{DESCRIPTION}}</p>
      </header>

      <p>这是新文章的开头。请在此处撰写正文。</p>
{{BODY}}

      <div class="callout callout-note">
        <strong>说明</strong> · 占位提示,正式内容上线后可以删除。
      </div>
    </article>

    <footer class="article-footer">
      <p>本页最后更新：{{DATE}} · 发现错别字？<a href="https://github.com/itingyu/itingyu.github.io/edit/master/posts/{{SLUG}}/index.html" rel="noopener">在 GitHub 上编辑</a>。</p>
    </footer>
  </main>

  <footer class="site-footer">
    <div class="links">
      <a href="/">首页</a>
      <a href="/posts/">文章</a>
      <a href="/archive/">归档</a>
      <a href="/about/">关于</a>
      <a href="/feeds/rss.xml">RSS</a>
      <a href="https://github.com/itingyu" rel="noopener">GitHub</a>
    </div>
    <p>&copy; 2026 itingyu · 内容仅供参考，不构成投资建议。</p>
  </footer>
</body>
</html>
